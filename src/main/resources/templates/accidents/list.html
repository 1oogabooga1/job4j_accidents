<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:include="fragments/header :: header"><title>list</title></head>
<body>
<div th:replace="fragments/navigation :: navigation"></div>
<div class="container mt-4">
    <h2>Accidents list</h2>
    <div class="row">
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Title</th>
                <th scope="col">Description</th>
                <th scope="col">Address</th>
                <th scope="col">Type</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="accident : ${accidents}">
                <td th:text="${accident.id}"></td>
                <td>
                    <a th:text="${accident.name}"
                       th:href="@{/accidents/{accidentId}(accidentId=${accident.id})}">
                    </a>
                </td>
                <td th:text="${accident.description}"></td>
                <td th:text="${accident.address}"></td>
                <td th:text="${accident.type.name}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="mb-3">
        <div class="row">
            <div class="col-12 d-flex justify-content-end">
                <a th:href="@{/accidents/create}" class="btn btn-primary">Add new accident</a>
            </div>
        </div>
    </div>
</div>
<footer th:include="fragments/footer :: footer"></footer>
</body>
</html>
